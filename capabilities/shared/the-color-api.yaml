naftiko: "1.0.0-alpha1"

info:
  label: "The Color API"
  description: "Free public REST API for color information, format conversions, and color scheme generation."
  tags:
    - Colors
    - Design
    - Utilities
  created: "2026-05-03"
  modified: "2026-05-03"

capability:
  consumes:
    - type: http
      namespace: colorapi
      baseUri: https://www.thecolorapi.com
      description: "The Color API — color conversions, naming, and scheme generation. No authentication required."
      resources:
        - name: colors
          path: /id
          description: Color identification and format conversion.
          operations:
            - name: get-color-info
              method: GET
              description: Get full color information including all format conversions and nearest named color.
              inputParameters:
                - name: hex
                  in: query
                  type: string
                  required: false
                  description: Color as hex code without # (e.g., 0047AB).
                - name: rgb
                  in: query
                  type: string
                  required: false
                  description: Color as RGB values (e.g., 0,71,171).
                - name: hsl
                  in: query
                  type: string
                  required: false
                  description: Color as HSL values (e.g., 215,100%,34%).
                - name: cmyk
                  in: query
                  type: string
                  required: false
                  description: Color as CMYK values (e.g., 100,58,0,33).
                - name: format
                  in: query
                  type: string
                  required: false
                  description: Response format — json, html, or svg.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: schemes
          path: /scheme
          description: Color scheme generation using color-wheel relationships.
          operations:
            - name: get-color-scheme
              method: GET
              description: Generate a harmonious color palette from a seed color.
              inputParameters:
                - name: hex
                  in: query
                  type: string
                  required: false
                  description: Seed color as hex code.
                - name: rgb
                  in: query
                  type: string
                  required: false
                  description: Seed color as RGB.
                - name: hsl
                  in: query
                  type: string
                  required: false
                  description: Seed color as HSL.
                - name: mode
                  in: query
                  type: string
                  required: false
                  description: Scheme mode (monochrome, complement, analogic, triad, quad, etc.).
                - name: count
                  in: query
                  type: integer
                  required: false
                  description: Number of colors to include in the scheme (1-10).
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: colorapi-rest
      resources:
        - path: /v1/colors
          name: colors
          description: Color identification and conversion.
          operations:
            - method: GET
              name: get-color-info
              description: Get full color data for any input color.
              call: "colorapi.get-color-info"
              with:
                hex: "rest.hex"
                rgb: "rest.rgb"
                hsl: "rest.hsl"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/schemes
          name: schemes
          description: Color scheme generation.
          operations:
            - method: GET
              name: get-color-scheme
              description: Generate a color scheme from a seed color.
              call: "colorapi.get-color-scheme"
              with:
                hex: "rest.hex"
                mode: "rest.mode"
                count: "rest.count"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: colorapi-mcp
      transport: http
      tools:
        - name: get-color-info
          description: Retrieve full color data including hex, RGB, HSL, CMYK, XYZ, named color, and contrast for any input color.
          hints:
            readOnly: true
            openWorld: true
          call: "colorapi.get-color-info"
          with:
            hex: "tools.hex"
            rgb: "tools.rgb"
            hsl: "tools.hsl"
            cmyk: "tools.cmyk"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-color-scheme
          description: Generate a harmonious color palette using monochrome, complement, analogic, triad, or quad color-wheel modes.
          hints:
            readOnly: true
            openWorld: true
          call: "colorapi.get-color-scheme"
          with:
            hex: "tools.hex"
            mode: "tools.mode"
            count: "tools.count"
          outputParameters:
            - type: object
              mapping: "$."
