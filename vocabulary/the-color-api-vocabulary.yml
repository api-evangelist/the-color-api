vocabulary:
  title: The Color API Vocabulary
  description: >-
    Domain vocabulary for The Color API covering color models, format conversions,
    naming, and scheme generation based on color theory.
  version: '1.0'
  created: '2026-05-03'
  modified: '2026-05-03'
  terms:
    - term: Hex
      label: Hexadecimal Color Code
      definition: >-
        A six-character alphanumeric code representing a color using the base-16 number
        system. Commonly written with a # prefix (e.g., #0047AB). Each pair of characters
        represents the red, green, and blue channels respectively.
      domain: Color Models

    - term: RGB
      label: Red Green Blue
      definition: >-
        An additive color model where red, green, and blue light are combined to produce
        colors. Each channel ranges from 0 to 255. Expressed as rgb(r,g,b).
      abbreviation: RGB
      domain: Color Models

    - term: HSL
      label: Hue Saturation Lightness
      definition: >-
        A cylindrical color model representing hue as a degree on the color wheel (0-360),
        saturation as a percentage of color intensity (0-100%), and lightness as a
        percentage from black to white (0-100%).
      abbreviation: HSL
      domain: Color Models

    - term: HSV
      label: Hue Saturation Value
      definition: >-
        A cylindrical color model similar to HSL but using Value (brightness) instead of
        Lightness. Also called HSB (Hue Saturation Brightness).
      abbreviation: HSV
      domain: Color Models

    - term: CMYK
      label: Cyan Magenta Yellow Key
      definition: >-
        A subtractive color model used in color printing. Components are Cyan (C),
        Magenta (M), Yellow (Y), and Key/Black (K), each expressed as a percentage 0-100.
      abbreviation: CMYK
      domain: Color Models

    - term: XYZ
      label: CIE XYZ Color Space
      definition: >-
        A device-independent color space defined by the International Commission on
        Illumination (CIE). Covers all colors visible to the average human observer
        and serves as the basis for other color spaces.
      domain: Color Models

    - term: NamedColor
      label: Named Color
      definition: >-
        A human-readable name for a color derived from the nearest match in a standard
        color naming database. The Color API returns the closest named color, its hex
        value, and the distance from the input color.
      domain: Naming

    - term: Contrast
      label: Contrast Color
      definition: >-
        The recommended foreground color (#ffffff or #000000) for text displayed over
        the input color as a background, calculated to maximize readability.
      domain: Accessibility

    - term: ColorScheme
      label: Color Scheme
      definition: >-
        A harmonious set of colors generated from a seed color using color-wheel
        relationships. The Color API supports monochrome, analogic, complement,
        triad, and quad scheme modes.
      domain: Color Theory

    - term: SchemeMode
      label: Scheme Mode
      definition: >-
        The color-wheel relationship used to generate a color palette.
      domain: Color Theory
      values:
        - monochrome: Different tints and shades of the same hue.
        - monochrome-dark: Dark variants of the same hue.
        - monochrome-light: Light variants of the same hue.
        - analogic: Colors adjacent on the color wheel.
        - complement: The seed color and its opposite on the color wheel.
        - analogic-complement: Analogic colors plus the complement.
        - triad: Three colors evenly spaced 120 degrees apart on the wheel.
        - quad: Four colors evenly spaced 90 degrees apart on the wheel.

    - term: Fraction
      label: Fractional Value
      definition: >-
        A normalized floating-point representation of a color channel value in the range 0.0-1.0,
        as opposed to the standard integer representations (0-255 for RGB or 0-360 for hue).
      domain: Color Models

    - term: Swatch
      label: Color Swatch
      definition: >-
        A visual image (SVG or PNG) generated by The Color API showing the color,
        optionally labeled with the color name or hex value. Available in bare (unlabeled)
        and named (labeled) variants.
      domain: Images
